name: istio-ingressgateway
replicaCount: 1

kind: Deployment

rbac:
  # If enabled, roles will be created to enable accessing certificates from Gateways. This is not needed
  # when using http://gateway-api.org/.
  enabled: true

serviceAccount:
  # If set, a service account will be created. Otherwise, the default is used
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set, the release name is used
  name: ""

podAnnotations:
  prometheus.io/port: "15020"
  prometheus.io/scrape: "true"
  prometheus.io/path: "/stats/prometheus"
  inject.istio.io/templates: "gateway"
  sidecar.istio.io/inject: "true"

# Define the security context for the pod.
# If unset, this will be automatically set to the minimum privileges required to bind to port 80 and 443.
# On Kubernetes 1.22+, this only requires the `net.ipv4.ip_unprivileged_port_start` sysctl.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

service:
  # Type of service. Set to "None" to disable the service entirely
  type: LoadBalancer
  # Set to a specific ClusterIP, or "" for automatic assignment
  clusterIP: ""
  # Additional labels to add to the service selector
  selectorLabels: {}
  ports:
  - name: status-port
    port: 15021
    protocol: TCP
    targetPort: 15021
  - name: http2
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  annotations: {}
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""
  healthCheckNodePort: 
  externalIPs: []
  ipFamilyPolicy: ""
  ipFamilies: []
  ## Whether to automatically allocate NodePorts (only for LoadBalancers).
  # allocateLoadBalancerNodePorts: false
  ## Set LoadBalancer class (only for LoadBalancers).
  # loadBalancerClass: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 2000m
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: {}
  autoscaleBehavior: {}

# Pod environment variables
env: {}

# Use envVarFrom to define full environment variable entries with complex sources,
# such as valueFrom.secretKeyRef, valueFrom.configMapKeyRef. Each item must include a `name` and `valueFrom`.
#
# Example:
# envVarFrom:
#   - name: EXAMPLE_SECRET
#     valueFrom:
#       secretKeyRef:
#         name: example-name
#         key: example-key
envVarFrom: []

# Deployment Update strategy
strategy: {}

# Sets the Deployment minReadySeconds value
minReadySeconds:

# Optionally configure a custom readinessProbe. By default the control plane
# automatically injects the readinessProbe. If you wish to override that
# behavior, you may define your own readinessProbe here.
readinessProbe: {}

# Labels to apply to all resources
labels:
  # By default, don't enroll gateways into the ambient dataplane
  "istio.io/dataplane-mode": none

# Annotations to apply to all resources
annotations: {}

nodeSelector:
  nodegroup: management-arm-rkt-mng

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "management"
    effect: "NoSchedule"

topologySpreadConstraints: []

affinity: {}

# If specified, the gateway will act as a network gateway for the given network.
networkGateway: ""

# Ports for the network gateway service. Only used when networkGateway is set.
# networkGatewayPorts:
#   status-port:
#     port: 15021
#     targetPort: 15021
#   tls:
#     port: 15443
#     targetPort: 15443
#   tls-istiod:
#     port: 15012
#     targetPort: 15012
#   tls-webhook:
#     port: 15017
#     targetPort: 15017

imagePullPolicy: "Always"

podDisruptionBudget:
  maxUnavailable: 1

# Configure the DNS policy for the gateway pods. See
# https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
# dnsPolicy: ""

# Configure DNS settings for the gateway pods. See
# https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
# dnsConfig: {}

# Sets the per-pod terminationGracePeriodSeconds setting.
terminationGracePeriodSeconds: 30

# A list of `Volumes` added into the Gateway Pods. See
# https://kubernetes.io/docs/concepts/storage/volumes/.
volumes: []

# A list of `VolumeMounts` added into the Gateway Pods. See
# https://kubernetes.io/docs/concepts/storage/volumes/.
volumeMounts: []

# Inject initContainers into the Gateway Pods.
initContainers: []

# Inject additional containers into the Gateway Pods.
additionalContainers: []

# Configure this to a higher priority class in order to make sure your Istio gateway pods
# will not be killed because of low priority class.
# Refer to https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass
# for more detail.
priorityClassName: ""

# Configure the lifecycle hooks for the gateway. See
# https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/.
lifecycle: {}

# When enabled, a default NetworkPolicy for gateways will be created
global:
  networkPolicy:
    enabled: false